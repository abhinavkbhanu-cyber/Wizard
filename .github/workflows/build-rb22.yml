name: Build RB22 Game Booster Pro

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'RB22-Game-Booster-Pro/**'
      - '.github/workflows/build-rb22.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: rb22-pc
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Show build environment
        shell: pwsh
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Node version:"
          node --version
          Write-Host "dotnet version:"
          dotnet --version
          Write-Host "dotnet info:"
          dotnet --info

      - name: Restore PC project
        run: dotnet restore RB22-Game-Booster-Pro/RB22-Game-Booster-Pro.csproj --runtime win-x64

      - name: Build PC project
        run: dotnet build RB22-Game-Booster-Pro/RB22-Game-Booster-Pro.csproj -c Release --no-restore --runtime win-x64

      - name: Download PresentMon telemetry engine
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path tools\presentmon | Out-Null
          gh release download v2.5.1 --repo GameTechDev/PresentMon --pattern "PresentMon-2.5.1-x64.exe" --dir tools\presentmon --clobber
          $pm = Get-ChildItem tools\presentmon -Filter "*.exe" | Select-Object -First 1
          if (-not $pm) { throw "PresentMon x64 binary was not downloaded." }
          Copy-Item $pm.FullName tools\presentmon\PresentMon.exe -Force

      - name: Publish portable Windows EXE
        run: dotnet publish RB22-Game-Booster-Pro/RB22-Game-Booster-Pro.csproj -c Release --no-restore -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Bundle PresentMon
        shell: pwsh
        run: Copy-Item tools\presentmon\PresentMon.exe publish\PresentMon.exe -Force

      - name: Upload RB22 Windows EXE artifact
        uses: actions/upload-artifact@v6
        with:
          name: RB22-Game-Booster-Pro-Windows-x64
          path: publish/*.exe

      - name: Publish latest GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem -Path publish -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "RB22 EXE was not produced." }

          gh release view latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest $exe.FullName --title "RB22 Game Booster Pro — Latest" --notes "Latest Windows x64 portable build of RB22 Game Booster Pro. Built automatically from main."
          } else {
            gh release upload latest $exe.FullName --clobber
            gh release edit latest --title "RB22 Game Booster Pro — Latest" --notes "Latest Windows x64 portable build of RB22 Game Booster Pro. Updated automatically from main."
          }
