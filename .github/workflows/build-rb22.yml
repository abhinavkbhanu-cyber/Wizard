name: Build RB22 Game Booster Pro
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Show build environment
        shell: pwsh
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Node version:"
          node --version
          Write-Host "dotnet version:"
          dotnet --version

      - name: Publish portable Windows EXE
        run: dotnet publish RB22-Game-Booster-Pro/RB22-Game-Booster-Pro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Upload RB22 Windows EXE artifact
        uses: actions/upload-artifact@v6
        with:
          name: RB22-Game-Booster-Pro-Windows-x64
          path: publish/*.exe

      - name: Publish latest GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem -Path publish -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "RB22 EXE was not produced." }

          gh release view latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest $exe.FullName --title "RB22 Game Booster Pro — Latest" --notes "Latest Windows x64 portable build of RB22 Game Booster Pro. Built automatically from main."
          } else {
            gh release upload latest $exe.FullName --clobber
            gh release edit latest --title "RB22 Game Booster Pro — Latest" --notes "Latest Windows x64 portable build of RB22 Game Booster Pro. Updated automatically from main."
          }
