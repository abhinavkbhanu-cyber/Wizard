name: Release RB22 Antivirus Alpha

on:
  push:
    tags:
      - 'rb22-antivirus-v*'

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/rb22-antivirus
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate release signing secrets
        env:
          RB22_ANTIVIRUS_KEYSTORE_BASE64: ${{ secrets.RB22_ANTIVIRUS_KEYSTORE_BASE64 }}
          RB22_KEYSTORE_PASSWORD: ${{ secrets.RB22_KEYSTORE_PASSWORD }}
          RB22_KEY_ALIAS: ${{ secrets.RB22_KEY_ALIAS }}
          RB22_KEY_PASSWORD: ${{ secrets.RB22_KEY_PASSWORD }}
        run: |
          test -n "$RB22_ANTIVIRUS_KEYSTORE_BASE64" || (echo "Missing RB22_ANTIVIRUS_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$RB22_KEYSTORE_PASSWORD" || (echo "Missing RB22_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$RB22_KEY_ALIAS" || (echo "Missing RB22_KEY_ALIAS repository secret" && exit 1)
          test -n "$RB22_KEY_PASSWORD" || (echo "Missing RB22_KEY_PASSWORD repository secret" && exit 1)
          echo "$RB22_ANTIVIRUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rb22-antivirus-release.jks"
          test -s "$RUNNER_TEMP/rb22-antivirus-release.jks"
      - name: Build signed release APK
        env:
          RB22_KEYSTORE_PATH: ${{ runner.temp }}/rb22-antivirus-release.jks
          RB22_KEYSTORE_PASSWORD: ${{ secrets.RB22_KEYSTORE_PASSWORD }}
          RB22_KEY_ALIAS: ${{ secrets.RB22_KEY_ALIAS }}
          RB22_KEY_PASSWORD: ${{ secrets.RB22_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk RB22-Antivirus-alpha.apk
          sha256sum RB22-Antivirus-alpha.apk > RB22-Antivirus-alpha.apk.sha256
      - name: Publish prototype prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" RB22-Antivirus-alpha.apk RB22-Antivirus-alpha.apk.sha256 \
            --title "RB22 Antivirus 0.1.0-alpha — Prototype" \
            --prerelease \
            --notes "Alpha prototype only. This build calculates a selected APK's SHA-256 fingerprint; it does NOT detect malware or provide real-time protection. Install only for testing. Updates require the same protected release-signing key and Android will require user confirmation."
