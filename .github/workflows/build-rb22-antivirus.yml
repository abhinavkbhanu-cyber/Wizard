name: RB22 Antivirus Android CI

on:
  push:
    paths:
      - 'RB22-Antivirus/**'
      - '.github/workflows/build-rb22-antivirus.yml'
  pull_request:
    paths:
      - 'RB22-Antivirus/**'
      - '.github/workflows/build-rb22-antivirus.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RB22-Antivirus
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RB22-Antivirus-0.1.0-alpha-debug
          path: RB22-Antivirus/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
