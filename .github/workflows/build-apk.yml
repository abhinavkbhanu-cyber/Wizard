name: Build and Publish RB22 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: rb22-mobile
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify Android project
        run: |
          gradle --version
          java -version
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon --no-build-cache --console=plain
      - name: Rename APK using app version
        id: apk
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION_NAME"
          APK_NAME="RB22-v${VERSION_NAME}-mobile-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RB22-Mobile-APK
          path: ${{ steps.apk.outputs.apk }}
      - name: Publish versioned and latest GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.apk.outputs.version }}
          APK_NAME: ${{ steps.apk.outputs.apk }}
        run: |
          VERSION_TAG="rb22-game-booster-v${VERSION_NAME}"
          gh release view "$VERSION_TAG" >/dev/null 2>&1 || gh release create "$VERSION_TAG" --title "RB22 Game Booster Pro v${VERSION_NAME}" --notes "RB22 Android mobile build. Review release notes and verify the APK before installing. Android confirmation is required to install updates."
          gh release upload "$VERSION_TAG" "$APK_NAME" --clobber
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "RB22 — Latest APK" --notes "Latest RB22 Android mobile build."
          gh release upload latest "$APK_NAME" --clobber
