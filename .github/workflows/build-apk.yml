name: Build and Publish RB22 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: rb22-mobile
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify Android project
        run: |
          gradle --version
          java -version
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon --no-build-cache --console=plain
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RB22-v3.0.0-ultimate-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RB22-Ultimate-APK
          path: RB22-v3.0.0-ultimate-debug.apk
      - name: Publish latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest 2>/dev/null || gh release create latest --title "RB22 — Latest APK" --notes "RB22 Android v3.0.0 ULTIMATE — adaptive gaming HUD, profiles, thermal/RAM/network telemetry, smart automation and capability-aware monitoring."
          gh release upload latest RB22-v1.0.0-debug.apk --clobber
