name: Build and Publish RB22 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"

      - name: Verify Android project
        run: |
          gradle --version
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RB22-v1.0.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RB22-APK
          path: RB22-v1.0.0-debug.apk

      - name: Publish latest GitHub Release
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh release view latest 2>/dev/null || gh release create latest --title "RB22 — Latest APK" --notes "Latest RB22 Android APK build from main."
          gh release upload latest RB22-v1.0.0-debug.apk --clobber
