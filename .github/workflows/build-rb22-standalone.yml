name: RB22 Standalone Build
on:
  push:
    branches: [main]
    paths:
      - 'RB22/**'
      - '.github/workflows/build-rb22-standalone.yml'
  workflow_dispatch:

# This workflow is artifact-only. build-rb22-pc.yml is the single owner of
# publishing the rb22-latest release, preventing two workflows from racing
# to upload the same RB22.exe asset.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore for Windows x64 publish
        run: dotnet restore RB22/RB22.csproj --runtime win-x64

      - name: Build
        run: dotnet build RB22/RB22.csproj --configuration Release --no-restore --runtime win-x64

      - name: Publish self-contained single-file EXE
        run: >
          dotnet publish RB22/RB22.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o RB22/publish

      - uses: actions/upload-artifact@v4
        with:
          name: RB22-PC-Performance-Suite-Windows-x64
          path: RB22/publish/RB22.exe
