name: RB22 Standalone Build
on:
  push:
    paths:
      - 'RB22/**'
      - '.github/workflows/build-rb22-standalone.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore RB22/RB22.csproj
      - run: dotnet build RB22/RB22.csproj --configuration Release --no-restore
      - run: dotnet publish RB22/RB22.csproj --configuration Release --no-build --output RB22/publish
      - uses: actions/upload-artifact@v4
        with:
          name: RB22-v0.1.0-alpha
          path: RB22/publish/
