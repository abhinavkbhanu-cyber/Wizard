name: RB22 Standalone Build
on:
  push:
    branches: [main]
    paths:
      - 'RB22/**'
      - '.github/workflows/build-rb22-standalone.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore for Windows x64 publish
        run: dotnet restore RB22/RB22.csproj --runtime win-x64

      - name: Build
        run: dotnet build RB22/RB22.csproj --configuration Release --no-restore --runtime win-x64

      - name: Publish self-contained single-file EXE
        run: >
          dotnet publish RB22/RB22.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o RB22/publish

      - uses: actions/upload-artifact@v4
        with:
          name: RB22-PC-Performance-Suite-Windows-x64
          path: RB22/publish/RB22.exe

      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: rb22-latest
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG RB22/publish/RB22.exe --clobber
            gh release edit $env:TAG --title "RB22 PC Performance Suite 0.3.0" --notes "RB22 PC v0.3.0. Live CPU/RAM telemetry, known-game detection, confirmed reversible process-priority control and system snapshot reports. The build must pass CI before release."
          } else {
            gh release create $env:TAG RB22/publish/RB22.exe --title "RB22 PC Performance Suite 0.3.0" --notes "RB22 PC v0.3.0. Live CPU/RAM telemetry, known-game detection, confirmed reversible process-priority control and system snapshot reports." --target $env:GITHUB_SHA
          }
