name: RB22 Antivirus Android CI

on:
  push:
    branches: [main, feature/rb22-antivirus-android]
    paths:
      - 'mobile/rb22-antivirus/**'
      - '.github/workflows/rb22-antivirus-android-ci.yml'
  pull_request:
    paths:
      - 'mobile/rb22-antivirus/**'
      - '.github/workflows/rb22-antivirus-android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rb22-antivirus-android-ci
  cancel-in-progress: true

jobs:
  debug-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/rb22-antivirus
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon --console=plain
      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload CI APK (not a production release)
        uses: actions/upload-artifact@v4
        with:
          name: RB22-Antivirus-Alpha-debug
          path: mobile/rb22-antivirus/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
