name: RB22 Antivirus Android CI

on:
  push:
    branches: [main, feature/rb22-antivirus-android, av]
    paths:
      - 'mobile/rb22-antivirus/**'
      - '.github/workflows/rb22-antivirus-android-ci.yml'
      - '.github/workflows/release-rb22-antivirus.yml'
  pull_request:
    paths:
      - 'mobile/rb22-antivirus/**'
      - '.github/workflows/rb22-antivirus-android-ci.yml'
      - '.github/workflows/release-rb22-antivirus.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rb22-antivirus-android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/rb22-antivirus
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon --console=plain
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon --console=plain
      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload CI APK (not a production release)
        uses: actions/upload-artifact@v4
        with:
          name: RB22-Antivirus-0.4.0-alpha-debug
          path: mobile/rb22-antivirus/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/av'
    needs: debug-build
    runs-on: ubuntu-24.04
    steps:
      - name: Download freshly built APK
        uses: actions/download-artifact@v4
        with:
          name: RB22-Antivirus-0.4.0-alpha-debug
          path: dist
      - name: Prepare checksum
        run: |
          cd dist
          mv app-debug.apk RB22-Antivirus-0.4.0-alpha-debug.apk
          sha256sum RB22-Antivirus-0.4.0-alpha-debug.apk > SHA256SUMS.txt
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: rb22-antivirus-v0.4.0-alpha
        run: |
          APK="dist/RB22-Antivirus-0.4.0-alpha-debug.apk"
          SUM="dist/SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber
          else
            gh release create "$TAG" "$APK#RB22-Antivirus-0.4.0-alpha-debug.apk" "$SUM#SHA-256 checksum" \
              --target "$GITHUB_SHA" \
              --title "RB22 Antivirus v0.4.0-alpha" \
              --notes "Fresh Android debug build from the av branch. This is an early test build, not a production-signed release. Android will ask the user to approve installation. Verify the APK with the included SHA-256 checksum."
          fi
      - name: Remove superseded RB22 AV release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view Rb22 >/dev/null 2>&1; then
            gh release delete Rb22 --cleanup-tag --yes
          fi
